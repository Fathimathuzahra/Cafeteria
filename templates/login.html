{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login | Campus Bites - AWH College Canteen</title>

<!-- Google Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg-cream: #FFF8F0;
  --bg-light: #FDE6C4;
  --primary-accent: #8B4513;
  --secondary-accent: #D2691E;
  --hover-accent: #A0522D;
  --text-dark: #3E2C1C;
  --text-medium: #5D4735;
  --text-white: #FFFFFF;
  --card-white: #FFFFFF;
  --gradient-accent: linear-gradient(135deg, #D2691E, #A0522D);
  --shadow-soft: 0 8px 25px rgba(0,0,0,0.08);
  --shadow-strong: 0 20px 50px rgba(0,0,0,0.15);
}

/* Base Reset */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: var(--bg-cream); color: var(--text-dark); }

/* =========================
   Header / Navbar
=========================== */
.header {
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-soft);
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  transition: all 0.4s ease;
  border-bottom: 2px solid rgba(139,69,19,0.15);
  background: rgba(255, 248, 240, 0.95);
}
.nav-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo-section {
  display: flex;
  align-items: center;
  gap: 1rem;
  text-decoration: none;
}
.logo {
  width: 60px; height: 60px;
  border-radius: 12px;
  object-fit: cover;
  border: 3px solid var(--primary-accent);
  transition: all 0.3s ease;
}
.logo:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(139,69,19,0.25);
}
.brand-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.9rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav-menu {
  list-style: none;
  display: flex;
  gap: 1.5rem;
}
.nav-link {
  color: var(--text-medium);
  text-decoration: none;
  font-weight: 500;
  padding: 0.75rem 1.2rem;
  border-radius: 25px;
  transition: all 0.3s ease;
}
.nav-link:hover {
  color: var(--primary-accent);
  background: rgba(139,69,19,0.08);
}

/* =========================
   Login Section
=========================== */
.hero-area {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(rgba(255,248,240,0.8), rgba(253,230,196,0.8)),
              url('{% static "images/20.jpg" %}') center/cover no-repeat;
  padding-top: 120px;
}
.form-container {
  background: var(--card-white);
  padding: 45px 35px;
  border-radius: 20px;
  box-shadow: var(--shadow-strong);
  width: 400px;
  border: 2px solid var(--primary-accent);
  transition: all 0.3s ease;
}
.form-container:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 60px rgba(139,69,19,0.25);
}
.form-icon { text-align: center; margin-bottom: 20px; }
.form-icon i {
  font-size: 50px;
  color: var(--primary-accent);
  background: var(--bg-light);
  padding: 15px;
  border-radius: 50%;
  border: 2px solid var(--primary-accent);
}
.form-container h2 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 30px;
  font-weight: 600;
  color: var(--primary-accent);
}

/* Input Fields */
.form-group { margin-bottom: 18px; position: relative; }
.form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--text-dark); }
.form-group input {
  width: 100%;
  padding: 12px 15px 12px 45px;
  border: 1px solid #d2b48c;
  border-radius: 10px;
  background: var(--bg-light);
  font-size: 15px;
  color: var(--text-dark);
  transition: 0.3s;
}
.form-group i {
  position: absolute;
  left: 15px;
  top: 38px;
  color: var(--primary-accent);
  font-size: 18px;
}
.form-group input:focus {
  background: #fff;
  border-color: var(--primary-accent);
  box-shadow: 0 0 10px rgba(139,69,19,0.2);
}

/* Buttons */
.site-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--gradient-accent);
  color: var(--text-white);
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  margin-top: 15px;
  transition: all 0.3s ease;
}
.site-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(210,105,30,0.4);
}

/* Links */
.links {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}
.links a {
  color: var(--primary-accent);
  text-decoration: none;
  font-weight: 500;
  display: flex;
  align-items: center;
}
.links a:hover { color: var(--secondary-accent); }
.links a i { margin-right: 5px; }

/* Messages */
.messages {
  text-align: center;
  color: var(--primary-accent);
  font-size: 14px;
  margin-bottom: 15px;
  background: #FFF3E0;
  padding: 10px;
  border-radius: 8px;
  border-left: 3px solid var(--secondary-accent);
}

/* Responsive */
@media(max-width:768px){
  .form-container { width: 90%; }
  .nav-menu { display: none; }
}
</style>
</head>
<body>

<!-- ✅ Updated Navbar -->
<header class="header">
  <div class="nav-container">
    <a href="{% url 'index' %}" class="logo-section">
      <img src="{% static 'images/logo.png' %}" alt="Cafeteria Logo" class="logo">
      <span class="brand-text">Cafeteria</span>
    </a>
    <ul class="nav-menu">
      <li><a href="{% url 'index' %}" class="nav-link">Home</a></li>
      <li><a href="{% url 'menu' %}" class="nav-link">Menu</a></li>
      <li><a href="{% url 'about' %}" class="nav-link">About</a></li>
    </ul>
  </div>
</header>

<!-- Login Section -->
<div class="hero-area">
  <div class="form-container">
    <div class="form-icon"><i class="fas fa-user-lock"></i></div>
    <h2>Login</h2>

    {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username <span style="color:red">*</span></label>
        <i class="fas fa-user"></i>
        <input type="text" name="username" id="username" placeholder="Enter Username" required>
      </div>

      <div class="form-group">
        <label for="password">Password <span style="color:red">*</span></label>
        <i class="fas fa-lock"></i>
        <input type="password" name="password" id="password" placeholder="Enter Password" required>
      </div>

      <button type="submit" class="site-btn">Login</button>

      <div class="links">
        <a href="{% url 'register' %}"><i class="fas fa-user-plus"></i> Register</a>
        <a href="{% url 'index' %}"><i class="fas fa-home"></i> Back to Home</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
