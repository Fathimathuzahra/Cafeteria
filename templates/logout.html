{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Logged Out | College Canteen</title>

<!-- Google Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary-color: #8B5E3C;       /* Brown */
    --primary-dark: #5A3E1B;        /* Dark Brown */
    --accent-color: #F0C05A;        /* Mustard Yellow */
    --secondary-color: #D2B48C;     /* Tan */
    --highlight-color: rgba(255, 235, 200, 0.85);
    --text-color: #4B3621;
    --white: #fff;
    --bg-light: #FAF8F0;            /* Cream White */
}

/* Reset & Global */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body {
    background: linear-gradient(135deg, var(--bg-light), #f4ede0);
    color: var(--text-color);
}

/* Navbar Styling */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    border-bottom: 2px solid var(--primary-color);
    border-radius: 0 0 15px 15px;
    position: sticky;
    top: 0;
    z-index: 999;
}
.brand {
    text-decoration: none;
    color: inherit;
}
.logo-container {
    display: flex;
    align-items: center;
    gap: 18px;
}
.logo {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--primary-color);
    background-color: var(--white);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
.logo:hover {
    transform: scale(1.15);
    box-shadow: 0 6px 20px rgba(139, 94, 60, 0.4);
    border-color: var(--primary-dark);
}
.brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--primary-color);
    transition: color 0.3s ease, transform 0.3s ease;
}
.brand-name:hover {
    color: var(--secondary-color);
    transform: scale(1.05);
}
.navbar ul {
    list-style: none;
    display: flex;
    gap: 20px;
}
.navbar ul li a {
    color: var(--primary-dark);
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 25px;
    border: 1px solid transparent;
    text-decoration: none;
    transition: all 0.3s ease, transform 0.3s ease;
}
.navbar ul li a:hover {
    background-color: var(--primary-color);
    color: var(--white);
    transform: translateY(-3px);
    box-shadow: 0 4px 12px rgba(139, 94, 60, 0.3);
    border: 1px solid var(--primary-color);
}

/* Hero / Logout Section */
.hero-area {
    display: flex; justify-content: center; align-items: center;
    min-height:100vh; padding-top:100px;
    background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('{% static "images/20.jpg" %}') no-repeat center center/cover;
    border-radius: 0 0 30px 30px;
}
.form-wrapper { width:100%; display:flex; justify-content:center; align-items:center; }
.form-container {
    background: var(--white); padding:50px 40px; border-radius:25px; box-shadow:0 12px 50px rgba(0,0,0,0.15);
    width:400px; border:2px solid var(--primary-color); transition: all 0.3s ease;
}
.form-container:hover { transform: translateY(-5px); box-shadow:0 15px 55px rgba(0,0,0,0.25); }
.form-icon { text-align:center; margin-bottom:20px; }
.form-icon i { font-size:50px; color:var(--primary-color); background:var(--white); padding:15px; border-radius:50%; border:2px solid var(--primary-color); }
.form-container h2 { text-align:center; margin-bottom:30px; font-size:32px; font-weight:600; color:var(--primary-dark); }
.form-container p { text-align:center; margin-bottom:25px; font-size:15px; color: var(--text-color); }
.site-btn {
    width:100%; padding:15px; border:none; border-radius:12px;
    background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
    color: var(--white); font-weight:600; font-size:16px; cursor:pointer; margin-top:20px; box-shadow:0 6px 15px rgba(139,94,60,0.3); transition: all 0.3s ease;
}
.site-btn:hover { background: linear-gradient(135deg, var(--primary-dark), var(--primary-color)); transform: translateY(-3px); box-shadow:0 8px 25px rgba(139,94,60,0.5); }

@media(max-width:768px){
    .form-container { width:90%; padding:35px 25px; }
    .navbar { padding:12px 20px; }
    .navbar ul { gap:15px; }
    .logo-container .brand-name { font-size:1.8rem; }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a href="{% url 'index' %}" class="brand">
        <div class="logo-container">
            <img src="{% static 'images/logo.png' %}" alt="Cafeteria Logo" class="logo"/>
            <span class="brand-name">Cafeteria</span>
        </div>
    </a>
    <ul>
        <li><a href="{% url 'index' %}">Home</a></li>
        <li><a href="{% url 'menu' %}">Menu</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
    </ul>
</nav>

<!-- Logout Section -->
<div class="hero-area">
    <div class="form-wrapper">
        <div class="form-container">
            <div class="form-icon"><i class="fas fa-sign-out-alt"></i></div>
            <h2>Logged Out</h2>
            <p>You’ve been successfully logged out from the Canteen Portal.</p>
            <a href="{% url 'login' %}" class="site-btn">Login Again</a>
        </div>
    </div>
</div>

</body>
</html>
