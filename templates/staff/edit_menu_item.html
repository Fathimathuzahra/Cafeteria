{% extends "staff/staff_base.html" %}
{% load static %}
{% block content %}

<style>
/* Form Container */
.form-container {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    background: #f0fdf4;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(67, 160, 71, 0.2);
    color: #333;
    font-family: 'Poppins', sans-serif;
    transition: transform 0.3s ease;
}
.form-container:hover {
    transform: translateY(-3px);
}

/* Heading */
.form-container h2 {
    text-align: center;
    color: #43a047;
    font-size: 1.8rem;
    margin-bottom: 25px;
}

/* Labels */
form label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #43a047;
}

/* Inputs, Select, Textarea */
form input, form select, form textarea {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid #c8e6c9;
    background: #ffffff;
    color: #333;
    font-size: 1rem;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
form input:focus,
form select:focus,
form textarea:focus {
    border-color: #43a047;
    box-shadow: 0 0 5px rgba(67, 160, 71, 0.4);
    outline: none;
}

/* File Input */
form input[type="file"] {
    background: none;
}

/* Submit Button */
.btn-submit {
    background: linear-gradient(90deg, #43a047, #66bb6a);
    color: #fff;
    font-weight: bold;
    padding: 12px 25px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
}
.btn-submit:hover {
    background: linear-gradient(90deg, #388e3c, #43a047);
    transform: translateY(-2px);
}

/* Responsive Adjustments */
@media (max-width: 768px) {
    .form-container {
        padding: 20px;
    }
    .btn-submit {
        width: 100%;
    }
}
</style>

<div class="form-container">
    <h2>Edit Menu Item</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Save Changes</button>
    </form>
</div>

{% endblock %}
