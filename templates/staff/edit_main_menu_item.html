{% extends "staff/staff_base.html" %}
{% load static %}

{% block content %}
<!-- Loading Spinner -->
<div id="loading-spinner" class="spinner-overlay d-none">
    <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<style>
/* Spinner Overlay */
.spinner-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1050;
}

/* Content Wrapper */
.content-wrapper {
    margin-top: 60px;
    margin-bottom: 60px;
}

/* Card Styling */
.card {
    background: #f0fdf4;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(67, 160, 71, 0.2);
    transition: transform 0.3s ease;
}
.card:hover {
    transform: translateY(-3px);
}

/* Heading */
.card h2 {
    color: #43a047;
    font-weight: 700;
}

/* Form Elements */
form label {
    font-weight: 600;
    color: #43a047;
}
form input, form select, form textarea {
    background: #ffffff;
    border: 1px solid #c8e6c9;
    border-radius: 8px;
    padding: 10px;
    color: #333;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
form input:focus, form select:focus, form textarea:focus {
    border-color: #43a047;
    box-shadow: 0 0 5px rgba(67,160,71,0.3);
    outline: none;
}

/* Submit Button */
.btn-warning {
    background: linear-gradient(90deg, #43a047, #66bb6a);
    border: none;
    transition: background 0.3s ease, transform 0.2s ease;
}
.btn-warning:hover {
    background: linear-gradient(90deg, #388e3c, #43a047);
    transform: translateY(-2px);
}

/* Responsive Adjustments */
@media (max-width: 768px) {
    .card {
        padding: 20px;
    }
}
</style>

<div class="container content-wrapper">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h2 class="mb-4 text-center">Edit Main Menu Item</h2>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post" enctype="multipart/form-data" id="edit-menu-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-warning btn-lg">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var spinner = document.getElementById("loading-spinner");
        var form = document.getElementById("edit-menu-form");

        form.addEventListener("submit", function() {
            spinner.classList.remove("d-none");
        });

        window.addEventListener("load", function() {
            spinner.classList.add("d-none");
        });
    });
</script>
{% endblock %}
